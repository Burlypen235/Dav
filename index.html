<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CerebraX</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>CerebraX</h1>
      <button id="newChat">+ New Chat</button>
      <div id="history" class="history"></div>
      <div class="settings">
        <label>Model</label>
        <select id="model">
          <option value="gpt-4.1">GPT-4.1</option>
          <option value="gpt-4o">GPT-4o</option>
          <option value="gpt-4.1-mini">GPT-4.1-mini</option>
        </select>
        <label>System Prompt</label>
        <textarea id="systemPrompt" rows="4" placeholder="You are CerebraX..."></textarea>
      </div>
    </aside>

    <main class="main">
      <header>
        <h2>Your personal AI assistant</h2>
        <div class="actions">
          <button id="exportBtn">Export</button>
          <button id="clearBtn">Clear</button>
        </div>
      </header>

      <section id="chat" class="chat"></section>

      <section class="tools">
        <label class="tool"><input type="checkbox" id="webSearch" /> Web Search</label>
        <label class="tool"><input type="checkbox" id="streaming" checked /> Streaming</label>
        <label class="tool"><input type="checkbox" id="memory" checked /> Memory</label>
        <input type="file" id="fileUpload" multiple />
      </section>

      <form id="composer" class="composer">
        <textarea id="message" placeholder="Message CerebraX" required></textarea>
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
