<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CerebraX</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="authGate" class="auth-gate">
    <div class="auth-card glass">
      <h1>CerebraX</h1>
      <p class="subtitle">Sign in to continue your chats.</p>
      <form id="authForm" class="auth-form">
        <label for="authName">Username</label>
        <input id="authName" type="text" autocomplete="username" required />

        <label for="authPass">Password</label>
        <input id="authPass" type="password" autocomplete="current-password" required />

        <div class="auth-actions">
          <button type="submit" id="loginBtn">Log In</button>
          <button type="button" id="registerBtn" class="secondary">Create Account</button>
        </div>
      </form>
      <p id="authStatus" class="status"></p>
    </div>
  </div>

  <div id="appRoot" class="app hidden">
    <aside class="sidebar glass">
      <div class="brand-row">
        <h1>CerebraX</h1>
        <button id="logoutBtn" class="secondary compact">Logout</button>
      </div>
      <button id="newChat">+ New Chat</button>
      <div id="history" class="history"></div>
      <div class="settings">
        <label>Model</label>
        <select id="model">
          <option value="gpt-4.1">GPT-4.1</option>
          <option value="gpt-4o">GPT-4o</option>
          <option value="gpt-4.1-mini">GPT-4.1-mini</option>
        </select>
        <label>System Prompt</label>
        <textarea id="systemPrompt" rows="4" placeholder="You are CerebraX..."></textarea>
      </div>
    </aside>

    <main class="main">
      <header class="glass">
        <h2>Your personal AI assistant</h2>
        <div class="actions">
          <button id="exportBtn" class="secondary">Export</button>
          <button id="clearBtn" class="danger">Clear</button>
        </div>
      </header>

      <section id="chat" class="chat"></section>

      <section class="tools glass-soft">
        <label class="tool"><input type="checkbox" id="webSearch" /> Web Search</label>
        <label class="tool"><input type="checkbox" id="streaming" checked /> Streaming</label>
        <label class="tool"><input type="checkbox" id="memory" checked /> Memory</label>
        <input type="file" id="fileUpload" multiple />
      </section>

      <form id="composer" class="composer">
        <textarea id="message" placeholder="Message CerebraX" required></textarea>
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
