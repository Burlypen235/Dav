<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Test Generator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header class="card">
      <h1>Student Test Generator</h1>
      <p>Create balanced tests for every level of study in seconds.</p>
    </header>

    <section class="card form-grid">
      <label>
        Study level
        <select id="studyLevel">
          <option>Primary School</option>
          <option>Middle School</option>
          <option>High School</option>
          <option>Undergraduate</option>
          <option>Postgraduate</option>
        </select>
      </label>

      <label>
        Subject
        <input id="subject" type="text" placeholder="e.g. Mathematics, Biology, History" required />
      </label>

      <label>
        Topic focus
        <input id="topic" type="text" placeholder="e.g. Fractions, Cell Structure" required />
      </label>

      <label>
        Number of questions
        <input id="numQuestions" type="number" min="5" max="40" value="10" />
      </label>

      <label>
        Difficulty blend
        <select id="difficulty">
          <option value="balanced">Balanced</option>
          <option value="easy">Mostly Easy</option>
          <option value="hard">Mostly Challenging</option>
        </select>
      </label>

      <label>
        Include answer key
        <select id="withAnswers">
          <option value="yes">Yes</option>
          <option value="no">No</option>
        </select>
      </label>

      <div class="actions">
        <button id="generateBtn" type="button">Generate Test</button>
        <button id="copyBtn" type="button" class="secondary">Copy</button>
        <button id="downloadBtn" type="button" class="secondary">Download .txt</button>
      </div>
    </section>

    <section class="card">
      <h2>Generated Test</h2>
      <pre id="output">Your test will appear here.</pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
